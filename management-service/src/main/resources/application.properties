# --- Identity & HTTP -----------------------------------------------------------------
quarkus.application.name=management-service
quarkus.http.port=8081

# --- Observability (plan §6.1) --------------------------------------------------------
# OTLP endpoint is environment-specific; override with OTEL_EXPORTER_OTLP_ENDPOINT or
# QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (compose points it at the SigNoz collector).
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
quarkus.otel.resource.attributes=service.namespace=anonymous-case-poc,deployment.environment=local
# Tests run without a collector; keep them quiet.
%test.quarkus.otel.sdk.disabled=true
# Random HTTP port so tests do not clash with the compose stack running locally.
%test.quarkus.http.test-port=0

# --- AMQP broker connection ------------------------------------------------------------
# Configured for dev/prod only: in the test profile the connection stays unset so the
# Quarkus Dev Service can provide a throwaway Artemis broker for @QuarkusTest.
# All values are overridable via env (AMQP_HOST, AMQP_PORT, AMQP_USERNAME, AMQP_PASSWORD).
%dev.amqp-host=localhost
%dev.amqp-port=5672
%dev.amqp-username=artemis
%dev.amqp-password=artemis
%prod.amqp-host=localhost
%prod.amqp-port=5672
%prod.amqp-username=artemis
%prod.amqp-password=artemis

# --- Messaging channels (plan §7.4/§8.3) -----------------------------------------------
# Incoming: bind to the concrete durable queue case.inbound.management on the
# case.inbound address via the Artemis fully-qualified queue name (FQQN).
# failure-strategy=reject nacks failed deliveries with the AMQP rejected outcome; the
# broker acceptor sets amqpTreatRejectAsUnmodifiedDeliveryFailed=true, so Artemis counts
# the attempt, applies bounded redelivery, and finally routes to the DLQ (plan §6.2).
mp.messaging.incoming.case-inbound-in.connector=smallrye-amqp
mp.messaging.incoming.case-inbound-in.address=case.inbound::case.inbound.management
mp.messaging.incoming.case-inbound-in.failure-strategy=reject

# Outgoing: address-oriented publish to case.outbound; messages are durable so they
# survive broker restart and consumer downtime.
mp.messaging.outgoing.case-outbound-out.connector=smallrye-amqp
mp.messaging.outgoing.case-outbound-out.address=case.outbound
mp.messaging.outgoing.case-outbound-out.durable=true

# Test-only channel: lets tests publish case.inbound events over real AMQP to
# exercise the consumer's durable-queue binding end to end.
%test.mp.messaging.outgoing.test-case-inbound.connector=smallrye-amqp
%test.mp.messaging.outgoing.test-case-inbound.address=case.inbound
%test.mp.messaging.outgoing.test-case-inbound.durable=true

# --- Persistence (Phase 2 plan §6/§8) ---------------------------------------------------
# Test profile leaves the datasource unset so Dev Services provide a throwaway
# PostgreSQL container; dev/prod point at the compose instance and are env-overridable
# (DB_URL/DB_USERNAME/DB_PASSWORD — the future ConfigMap/Secret contract).
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/case_poc
%dev.quarkus.datasource.username=management_service
%dev.quarkus.datasource.password=management_service
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/case_poc}
%prod.quarkus.datasource.username=${DB_USERNAME:management_service}
%prod.quarkus.datasource.password=${DB_PASSWORD:management_service}

# Schema is owned by this service (plan §6); Flyway manages DDL, Hibernate never does.
# create-schemas only matters for the Dev Services container, where the schema does not
# pre-exist; in compose the init script created it with the right ownership.
quarkus.hibernate-orm.database.default-schema=management
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=management
quarkus.flyway.create-schemas=true

# --- OIDC (Phase 2 plan §5.2) ------------------------------------------------------------
# All management endpoints require a Keycloak JWT with the case-manager realm role.
# dev talks to the compose Keycloak on the host port; prod (container) is configured via
# env (QUARKUS_OIDC_AUTH_SERVER_URL, QUARKUS_OIDC_TOKEN_ISSUER — see infra compose).
# The test profile leaves auth-server-url unset and disables the Keycloak Dev Service:
# tests inject identities with @TestSecurity/@OidcSecurity instead of a live IdP.
quarkus.oidc.client-id=management-api
quarkus.oidc.application-type=service
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/case-poc
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/case-poc}
%test.quarkus.keycloak.devservices.enabled=false

# --- Outbox relay (Phase 2 plan §5.3) ----------------------------------------------------
# The relay polls PENDING rows, publishes with a settle-wait, and retries with bounded
# exponential backoff. POST endpoints no longer wait for the broker (plan §2).
app.outbox.poll-interval=1s
%test.app.outbox.poll-interval=PT0.5S
app.outbox.publish-timeout=5S
app.outbox.max-batch=25
app.outbox.max-backoff=30S

# --- Kubernetes readiness (Phase 2 plan §1 row 5/6) --------------------------------------
# Readiness includes the datasource and AMQP channel checks automatically; the shutdown
# timeout is the compose/k8s termination-grace rehearsal (drain HTTP, finish the tick).
quarkus.shutdown.timeout=10
