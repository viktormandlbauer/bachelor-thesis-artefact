apiVersion: v1
kind: Service
metadata:
  name: {{ include "case-poc.fullname" . }}-postgres
  labels:
    {{- include "case-poc.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  {{- if .Values.postgres.enabled }}
  selector:
    {{- include "case-poc.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  {{- else }}
  # Selector-less: fronts the compose PostgreSQL on the control-plane VM.
  # The EndpointSlice (node IP : bridge port) is runtime state, created at
  # bootstrap by scripts/argocd-install.sh — like signoz-collector.
  ports:
    - name: postgres
      port: 5432
      targetPort: {{ .Values.postgres.externalPort }}
  {{- end }}
