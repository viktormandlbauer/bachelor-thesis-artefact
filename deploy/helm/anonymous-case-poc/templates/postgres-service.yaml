apiVersion: v1
kind: Service
metadata:
  name: {{ include "case-poc.fullname" . }}-postgres
  labels:
    {{- include "case-poc.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "case-poc.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
