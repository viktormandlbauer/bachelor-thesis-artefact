apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "case-poc.fullname" . }}-postgres
  labels:
    {{- include "case-poc.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  # RWO volume: the old pod must release the data directory before a new one
  # starts (same rationale as Artemis).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "case-poc.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "case-poc.labels" . | nindent 8 }}
        {{- include "case-poc.selectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
      annotations:
        checksum/init-script: {{ .Files.Get "files/postgres-init.sh" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "case-poc.podSecurityContext" (dict "uid" .Values.postgres.runAsUser) | nindent 8 }}
        runAsGroup: {{ .Values.postgres.runAsGroup }}
        fsGroup: {{ .Values.postgres.runAsGroup }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "case-poc.containerSecurityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: case_poc
            - name: POSTGRES_USER
              value: postgres
            # Subdirectory of the mount: initdb refuses a data dir that is
            # not empty (the volume root carries lost+found / fsGroup bits).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # POSTGRES_PASSWORD plus the two per-service passwords consumed by
          # the init script (files/postgres-init.sh).
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.db }}
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "case_poc"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "case_poc"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "case_poc"]
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "case-poc.fullname" . }}-postgres-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: init
          configMap:
            name: {{ include "case-poc.fullname" . }}-postgres-init
