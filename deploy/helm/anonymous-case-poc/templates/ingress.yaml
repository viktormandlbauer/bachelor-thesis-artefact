{{- if .Values.ingress.enabled }}
# Host-routed HTTP through the k3s-bundled Traefik. POC scope: no TLS —
# acceptable only because the cluster is local-only. The management API is
# OIDC-protected (Phase 2); Keycloak is routed through the same ingress so
# that tokens fetched from outside carry the issuer the in-cluster
# management-service verifies (see keycloak-deployment.yaml, KC_HOSTNAME).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "case-poc.fullname" . }}
  labels:
    {{- include "case-poc.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.submissionHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "case-poc.fullname" . }}-submission
                port:
                  name: http
    - host: {{ .Values.ingress.managementHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "case-poc.fullname" . }}-management
                port:
                  name: http
    - host: {{ .Values.ingress.keycloakHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "case-poc.fullname" . }}-keycloak
                port:
                  name: http
{{- end }}
