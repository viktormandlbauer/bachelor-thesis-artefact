{{- if .Values.hardenDefaultServiceAccount }}
# CIS 5.1.5/5.1.6: the app pods never talk to the Kubernetes API, so the
# namespace's default ServiceAccount must not automount tokens. The SA object
# already exists (created by the service-account controller); this manifest
# claims it to keep the setting under GitOps control. Never prune/delete it -
# Kubernetes would just recreate it with defaults. (Plain `helm install`
# cannot take ownership of the pre-existing SA — the validation script
# disables this manifest for its throwaway namespace.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    {{- include "case-poc.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
