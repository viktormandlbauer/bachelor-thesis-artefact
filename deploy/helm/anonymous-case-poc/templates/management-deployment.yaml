apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "case-poc.fullname" . }}-management
  labels:
    {{- include "case-poc.labels" . | nindent 4 }}
    app.kubernetes.io/name: management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "case-poc.selectorLabels" (dict "root" . "component" "management-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "case-poc.labels" . | nindent 8 }}
        {{- include "case-poc.selectorLabels" (dict "root" . "component" "management-service") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "case-poc.podSecurityContext" (dict "uid" .Values.services.runAsUser) | nindent 8 }}
      containers:
        - name: management-service
          image: "{{ .Values.images.management.repository }}:{{ .Values.images.management.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "case-poc.containerSecurityContext" . | nindent 12 }}
          env:
            - name: AMQP_HOST
              value: {{ include "case-poc.fullname" . }}-artemis
            - name: AMQP_PORT
              value: "5672"
            - name: AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.artemis }}
                  key: ARTEMIS_USER
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.artemis }}
                  key: ARTEMIS_PASSWORD
            # Phase-2 persistence (env contract from infra/docker-compose.yml)
            - name: DB_URL
              value: jdbc:postgresql://{{ include "case-poc.fullname" . }}-postgres:5432/case_poc
            - name: DB_USERNAME
              value: management_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: MANAGEMENT_DB_PASSWORD
            # Phase-2 OIDC: discovery/JWKS over the in-cluster backchannel;
            # issuer check pinned to the public hostname Keycloak stamps into
            # every token (KC_HOSTNAME on the keycloak deployment). The
            # connection delay tolerates Keycloak still importing the realm
            # when this pod starts.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://{{ include "case-poc.fullname" . }}-keycloak:8080/realms/case-poc
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: http://{{ .Values.ingress.keycloakHost }}/realms/case-poc
            - name: QUARKUS_OIDC_CONNECTION_DELAY
              value: 120S
            {{- if .Values.otel.enabled }}
            - name: QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: QUARKUS_OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | quote }}
            {{- else }}
            # No OTLP collector in the POC cluster; silence the exporter.
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.services.resources | nindent 12 }}
