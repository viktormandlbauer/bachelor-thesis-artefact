# /etc/sysctl.d/90-kubelet.conf
#
# Kernel parameters required by kubelet when k3s runs with
# protect-kernel-defaults=true (deploy/cluster/k3s/config.yaml).
# Values follow the Rancher k3s CIS hardening guide.
vm.panic_on_oom=0
vm.overcommit_memory=1
kernel.panic=10
kernel.panic_on_oops=1
kernel.keys.root_maxbytes=25000000
kernel.keys.root_maxkeys=1000000
