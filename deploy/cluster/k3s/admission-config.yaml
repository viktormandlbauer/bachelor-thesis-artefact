# /var/lib/rancher/k3s/server/admission-config.yaml
#
# API server admission configuration for the hardened POC cluster:
#
#  - PodSecurity: enforce the "restricted" Pod Security Standard cluster-wide.
#    Only kube-system is exempt (k3s system pods - svclb, helm-install jobs -
#    need privileges the restricted profile forbids). Everything else, including
#    the argocd and case-poc namespaces, must comply.
#
#  - EventRateLimit: server-wide event flood protection (CIS 1.2.9).
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: "restricted"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces: [kube-system]
  - name: EventRateLimit
    configuration:
      apiVersion: eventratelimit.admission.k8s.io/v1alpha1
      kind: Configuration
      limits:
        - type: Server
          qps: 5000
          burst: 20000
