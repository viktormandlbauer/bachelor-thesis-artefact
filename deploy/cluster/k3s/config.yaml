# /etc/rancher/k3s/config.yaml (control-plane / server node)
#
# CIS-hardened k3s server for the anonymous-case POC: the dedicated
# control-plane node of the cluster (agents get their own config from
# deploy/vm/ansible/templates/k3s-agent-config.yaml.j2). Aligned with the
# Rancher k3s CIS hardening guide and the kube-bench k3s-cis-1.9 profile
# (see scripts/kube-bench-run.sh).
#
# k3s already satisfies most scored CIS checks by default (anonymous-auth=false,
# Node+RBAC authorization, NodeRestriction, profiling=false, secure TLS ciphers,
# read-only-port=0, ...). This file adds only what defaults do not cover.

# Embedded etcd instead of sqlite: the k3s-cis-1.9 kube-bench profile audits the
# etcd datastore (config at /var/lib/rancher/k3s/server/db/etcd/config).
cluster-init: true

# Encrypt Secret resources at rest in the datastore (CIS 1.2.27/1.2.28 area).
secrets-encryption: true

# Kubelet refuses to start unless the kernel flags match its expectations
# (CIS 4.2.5). Requires the sysctls from deploy/cluster/k3s/90-kubelet-sysctl.conf
# to be applied first (done by deploy/vm/ansible/site.yml).
protect-kernel-defaults: true

kube-apiserver-arg:
  # EventRateLimit (CIS 1.2.9) + cluster-wide PodSecurity "restricted" default;
  # both plugins are configured in admission-config.yaml. NodeRestriction is a
  # k3s default but must be repeated because this flag replaces the default list.
  - enable-admission-plugins=NodeRestriction,EventRateLimit
  - admission-control-config-file=/var/lib/rancher/k3s/server/admission-config.yaml
  # API audit logging (CIS 1.2.16-1.2.19).
  - audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log
  - audit-policy-file=/var/lib/rancher/k3s/server/audit-policy.yaml
  - audit-log-maxage=30
  - audit-log-maxbackup=10
  - audit-log-maxsize=100

kube-controller-manager-arg:
  # Bound the number of terminated pods kept around (CIS 1.3.1).
  - terminated-pod-gc-threshold=10

kubelet-arg:
  # Idle streaming connections (exec/attach/logs) are closed after 5m (CIS 4.2.5 area).
  - streaming-connection-idle-timeout=5m
  # Explicitly pin the iptables util chains behaviour (CIS 4.2.6 expects the flag).
  - make-iptables-util-chains=true
