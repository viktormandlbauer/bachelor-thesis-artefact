# GitOps guardrails for the POC: only the internal GitLab repository as
# source (the `gitlab` Service in the argocd namespace fronts the GitLab on
# the control-plane VM — runtime EndpointSlice created by
# scripts/argocd-install.sh), only the two namespaces the namespace-scoped
# Argo CD is allowed to touch, and no cluster-scoped resources at all.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: case-poc
  namespace: argocd
spec:
  description: Anonymous-case POC (bachelor thesis artefact)
  sourceRepos:
    - http://gitlab.argocd.svc.cluster.local/root/bachelor-thesis-artefact.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: case-poc
  clusterResourceWhitelist: []
