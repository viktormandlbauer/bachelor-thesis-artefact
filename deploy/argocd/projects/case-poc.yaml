# GitOps guardrails for the POC: only this repository as source, only the two
# namespaces the namespace-scoped Argo CD is allowed to touch, and no
# cluster-scoped resources at all.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: case-poc
  namespace: argocd
spec:
  description: Anonymous-case POC (bachelor thesis artefact)
  sourceRepos:
    - https://github.com/viktormandlbauer/bachelor-thesis-artefact.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: case-poc
  clusterResourceWhitelist: []
