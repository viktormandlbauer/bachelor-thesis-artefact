# Explicit "in-cluster" destination for the namespace-scoped Argo CD install.
# The `namespaces` list switches the application controller into namespaced
# cache mode: it only watches/manages the listed namespaces, matching the
# Role/RoleBinding grants (no ClusterRole -> no CIS 5.1.x violations).
apiVersion: v1
kind: Secret
metadata:
  name: cluster-in-cluster
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  namespaces: argocd,case-poc
  config: |
    {"tlsClientConfig": {"insecure": false}}
