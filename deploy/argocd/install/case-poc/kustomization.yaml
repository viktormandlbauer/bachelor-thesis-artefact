# Target namespace for the application, pre-created out-of-band because the
# namespace-scoped Argo CD cannot create cluster-scoped resources (namespaces).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: case-poc
resources:
  - namespace.yaml
  - default-sa.yaml
  - argocd-rbac.yaml
